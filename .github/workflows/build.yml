name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DafiumArsiv.csproj -c Release
      - name: Build engine tests
        run: dotnet build testler/MotorTestleri/MotorTestleri.csproj -c Release
      - name: Portable publish
        run: dotnet publish DafiumArsiv.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o yayin
      - uses: actions/upload-artifact@v4
        with:
          name: DafiumArchive-win-x64
          path: yayin/
